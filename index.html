<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Presentation</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; align-items: center; justify-content: center; }
  /* Keep the original 825x600 aspect ratio, scaled to fit the window */
  #player { width: min(100vw, calc(100vh * 825 / 600)); aspect-ratio: 825 / 600; }
  #player > * { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    publicPath: "ruffle/",
    autoplay: "on",
    unmuteOverlay: "hidden",
    letterbox: "on",
    // Shows a progress bar while the large SWF downloads
    splashScreen: true,
    warnOnUnsupportedContent: false,
    allowScriptAccess: true,
    // Introduction.swf loads the Fire/Forest/Ice SWFs by relative name
    base: "./",
  };
</script>
<script src="ruffle/ruffle.js"></script>
<script>
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  document.getElementById("player").appendChild(player);
  player.ruffle().load({ url: "Introduction.swf" });
</script>
</body>
</html>
